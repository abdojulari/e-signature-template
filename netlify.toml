[build]
  publish = ".output/public"
  command = "rm -rf node_modules package-lock.json && npm install && npm run generate"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--prefer-offline --no-audit"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "pnpm run dev"
  port = 3000
  publish = ".output/public"
