[build]
  publish = ".output/public"
  command = "rm -rf node_modules package-lock.json pnpm-lock.yaml .pnpm-store .pnpm && npm install --legacy-peer-deps --no-optional && npm run generate"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--prefer-offline --no-audit --legacy-peer-deps --no-optional"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  NPM_CONFIG_OPTIONAL = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "pnpm run dev"
  port = 3000
  publish = ".output/public"
