[build]
  publish = ".output/public"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm run generate"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline --no-audit"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "pnpm run dev"
  port = 3000
  publish = ".output/public"
