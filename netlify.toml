[build]
  publish = ".output/public"
  command = "rm -rf node_modules package-lock.json pnpm-lock.yaml .pnpm-store .pnpm .npmrc && pnpm install --shamefully-hoist --ignore-scripts && pnpm run generate"

[build.environment]
  NODE_VERSION = "18"
  PNPM_VERSION = "8"
  NPM_FLAGS = "--prefer-offline --no-audit"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "pnpm run dev"
  port = 3000
  publish = ".output/public"
