[build]
  publish = ".output/public"
  command = "pnpm install --frozen-lockfile && pnpm run generate"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline --no-audit"
  # Pin the Nitro preset so the output path is deterministic on Netlify
  # (otherwise Nuxt auto-switches to "netlify-static" and writes to ./dist).
  NITRO_PRESET = "static"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "pnpm run dev"
  port = 3000
  publish = ".output/public"
